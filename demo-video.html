<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhavana Reddy Portfolio — Video Demo Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --primary: #3b82f6;
      --accent: #38bdf8;
      --emerald: #10b981;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }
    .brand span {
      color: var(--accent);
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
    }
    .video-container {
      width: 100%;
      max-width: 1100px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
      background: #090e17;
    }
    .video-controls {
      background: #111827;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    .timeline-bar {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .timeline-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #38bdf8);
      border-radius: 999px;
      transition: width 0.1s linear;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-action {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #374151;
      border-color: var(--accent);
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-record {
      background: #dc2626;
      border-color: #ef4444;
    }
    .btn-record:hover {
      background: #b91c1c;
    }
    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .scene-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .scene-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scene-pill.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #fff;
    }
    .info-card {
      width: 100%;
      max-width: 1100px;
      margin-top: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .info-card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .info-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-play-circle" style="color:var(--accent); font-size:1.4rem;"></i>
      <span>Bhavana Reddy</span> Portfolio Showcase Walkthrough
    </div>
    <div class="badge">
      <span class="pulse-dot"></span> 60 FPS • High Definition Walkthrough
    </div>
  </header>

  <div class="video-container">
    <canvas id="demoCanvas" width="1280" height="720"></canvas>
    
    <div class="video-controls">
      <div class="timeline-bar" id="timelineBar">
        <div class="timeline-progress" id="timelineProgress"></div>
      </div>

      <div class="controls-row">
        <div class="left-controls">
          <button class="btn-action btn-primary" id="playBtn">
            <i class="fa-solid fa-pause" id="playIcon"></i> <span id="playText">Pause</span>
          </button>
          <button class="btn-action" id="restartBtn">
            <i class="fa-solid fa-rotate-left"></i> Restart
          </button>
          <span class="time-display" id="timeDisplay">00:00 / 00:35</span>
        </div>

        <div class="scene-pills">
          <button class="scene-pill active" data-time="0">1. Hero &amp; Bio</button>
          <button class="scene-pill" data-time="5">2. Live AI Code</button>
          <button class="scene-pill" data-time="11">3. System Flow</button>
          <button class="scene-pill" data-time="17">4. Projects Showcase</button>
          <button class="scene-pill" data-time="24">5. Academic Pathway</button>
          <button class="scene-pill" data-time="29">6. Connect &amp; Resume</button>
        </div>

        <div class="right-controls">
          <button class="btn-action btn-record" id="recordBtn">
            <i class="fa-solid fa-video"></i> <span id="recordText">Export Video File</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="info-card">
    <div>
      <strong>Live Portfolio:</strong> <a href="https://bhavana-1228.github.io/Portfolio/" target="_blank">https://bhavana-1228.github.io/Portfolio/</a>
    </div>
    <div>
      <a href="https://github.com/Bhavana-1228/Portfolio" target="_blank" class="btn-action">
        <i class="fa-brands fa-github"></i> GitHub Source
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    const timelineBar = document.getElementById('timelineBar');
    const timelineProgress = document.getElementById('timelineProgress');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const restartBtn = document.getElementById('restartBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const scenePills = document.querySelectorAll('.scene-pill');
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');

    const TOTAL_DURATION = 35; // seconds
    let currentTime = 0;
    let isPlaying = true;
    let lastTimestamp = performance.now();

    // MediaRecorder for export
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Ambient floating particles
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * 1280,
      y: Math.random() * 720,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      size: Math.random() * 2 + 1
    }));

    // Profile photo placeholder / loaded image
    const profileImg = new Image();
    profileImg.src = 'assets/profile.jpeg';

    function drawBrowserChrome() {
      // Top bar
      ctx.fillStyle = '#0d131f';
      ctx.fillRect(0, 0, 1280, 52);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, 0, 1280, 52);

      // Dots
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(24, 26, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(42, 26, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.beginPath(); ctx.arc(60, 26, 6, 0, Math.PI * 2); ctx.fill();

      // Search bar
      ctx.fillStyle = '#1e293b';
      ctx.roundRect(140, 12, 700, 28, 8);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '13px "JetBrains Mono", monospace';
      ctx.fillText('🔒 https://bhavana-1228.github.io/Portfolio/', 155, 30);

      // Top right status
      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px Inter, sans-serif';
      ctx.fillText('Bhavana Reddy Chinnaobaiahgari — AI Portfolio', 920, 31);
    }

    function renderScene(time) {
      // Clear
      ctx.fillStyle = '#070b12';
      ctx.fillRect(0, 0, 1280, 720);

      // Background Ambient Grid & Particles
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1280; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 52); ctx.lineTo(x, 720); ctx.stroke();
      }
      for (let y = 52; y < 720; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
      }

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1280; if (p.x > 1280) p.x = 0;
        if (p.y < 52) p.y = 720; if (p.y > 720) p.y = 52;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });

      // Browser Mockup Top
      drawBrowserChrome();

      // SCENE 1: HERO & BIO (0s - 5s)
      if (time >= 0 && time < 5) {
        const progress = time / 5;
        const opacity = Math.min(1, progress * 4);

        ctx.save();
        ctx.globalAlpha = opacity;

        // Profile Pill
        ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1;
        ctx.roundRect(80, 90, 320, 38, 19);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#10b981';
        ctx.beginPath(); ctx.arc(104, 109, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.font = '600 13px Inter, sans-serif';
        ctx.fillText('Available for AI & Data Science Roles', 120, 114);

        // Name & Greeting
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 20px Inter, sans-serif';
        ctx.fillText("Hi there, I'm", 80, 170);

        ctx.fillStyle = '#ffffff';
        ctx.font = '800 46px Inter, sans-serif';
        ctx.fillText('Bhavana Reddy Chinnaobaiahgari', 80, 225);

        // Typewriter subtitle
        const roles = ['AI & Data Science Professional', 'Computer Vision & DeepFace Specialist', 'Full-Stack Python Engineer'];
        const activeRoleIdx = Math.floor(time * 0.8) % roles.length;
        ctx.fillStyle = '#38bdf8';
        ctx.font = '700 28px Inter, sans-serif';
        ctx.fillText(roles[activeRoleIdx] + ' |', 80, 275);

        // Badges
        const badges = ['🎓 8.12 CGPA (AITS)', '📅 2026 Batch', '🧠 OpenCV & DeepFace', '🟢 Open to Work'];
        badges.forEach((b, i) => {
          ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.roundRect(80 + i * 180, 315, 168, 34, 8);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '600 13px Inter, sans-serif';
          ctx.fillText(b, 92 + i * 180, 337);
        });

        // Summary text
        ctx.fillStyle = '#94a3b8';
        ctx.font = '400 16px Inter, sans-serif';
        ctx.fillText('B.Tech graduate in AI & Data Science with hands-on experience developing real-time', 80, 395);
        ctx.fillText('facial emotion recognition systems, statistical ML pipelines, and full-stack web applications.', 80, 422);

        // Action CTA buttons
        ctx.fillStyle = '#2563eb';
        ctx.roundRect(80, 470, 160, 46, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '600 15px Inter, sans-serif';
        ctx.fillText('View Projects →', 105, 498);

        ctx.fillStyle = '#10b981';
        ctx.roundRect(260, 470, 160, 46, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText('WhatsApp Me', 290, 498);

        // Right side: Portrait Card
        ctx.fillStyle = '#111827';
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 2;
        ctx.roundRect(870, 110, 330, 420, 20);
        ctx.fill(); ctx.stroke();

        if (profileImg.complete && profileImg.naturalWidth > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(890, 130, 290, 310, 14);
          ctx.clip();
          ctx.drawImage(profileImg, 890, 130, 290, 310);
          ctx.restore();
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.roundRect(890, 130, 290, 310, 14);
          ctx.fill();
          ctx.fillStyle = '#38bdf8';
          ctx.font = '600 20px Inter, sans-serif';
          ctx.fillText('Bhavana Reddy', 950, 290);
        }

        ctx.fillStyle = '#fff';
        ctx.font = '700 18px Inter, sans-serif';
        ctx.fillText('Bhavana Reddy', 910, 478);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '500 13px Inter, sans-serif';
        ctx.fillText('B.Tech AI & Data Science (2026)', 910, 502);

        ctx.restore();
      }

      // SCENE 2: LIVE CODE RUNNER (5s - 11s)
      else if (time >= 5 && time < 11) {
        const sub = time - 5;
        ctx.save();

        ctx.fillStyle = '#fff';
        ctx.font = '800 32px Inter, sans-serif';
        ctx.fillText('Interactive Real-Time Code Execution', 80, 100);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '500 15px Inter, sans-serif';
        ctx.fillText('Live testing OpenCV & DeepFace emotion recognition engine directly on the browser', 80, 126);

        // Code Window Card
        ctx.fillStyle = '#0b1120';
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
        ctx.lineWidth = 1;
        ctx.roundRect(80, 150, 1120, 510, 16);
        ctx.fill(); ctx.stroke();

        // Window Header
        ctx.fillStyle = '#0f172a';
        ctx.roundRect(80, 150, 1120, 44, [16, 16, 0, 0]);
        ctx.fill();

        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(106, 172, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(126, 172, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(146, 172, 6, 0, Math.PI*2); ctx.fill();

        // Code Tabs
        ctx.fillStyle = '#1e293b';
        ctx.roundRect(180, 158, 160, 30, 6); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.font = '600 13px "JetBrains Mono", monospace';
        ctx.fillText('emotion_ai.py', 205, 178);

        ctx.fillStyle = '#94a3b8';
        ctx.fillText('data_pipeline.py', 370, 178);
        ctx.fillText('views.py', 530, 178);

        // Run button simulation
        ctx.fillStyle = sub > 1.5 ? '#10b981' : '#2563eb';
        ctx.roundRect(1080, 158, 100, 28, 6); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '600 12px Inter, sans-serif';
        ctx.fillText(sub > 1.5 ? '✓ Running' : '▶ Run Code', 1098, 177);

        // Code Body
        ctx.font = '14px "JetBrains Mono", monospace';
        const codeLines = [
          { text: '# Real-Time Facial Emotion Detection Engine', color: '#64748b' },
          { text: 'import cv2', color: '#f43f5e' },
          { text: 'from deepface import DeepFace', color: '#f43f5e' },
          { text: '', color: '#fff' },
          { text: 'def predict_facial_emotion(video_frame):', color: '#38bdf8' },
          { text: '    predictions = DeepFace.analyze(', color: '#e2e8f0' },
          { text: "        img_path=video_frame, actions=['emotion'], enforce_detection=False", color: '#fbbf24' },
          { text: '    )', color: '#e2e8f0' },
          { text: "    dominant = predictions[0]['dominant_emotion']", color: '#e2e8f0' },
          { text: '    return {', color: '#e2e8f0' },
          { text: '        "engineer": "Bhavana Reddy", "dominant_emotion": dominant, "accuracy_score": 0.984', color: '#34d399' },
          { text: '    }', color: '#e2e8f0' }
        ];

        codeLines.forEach((l, idx) => {
          ctx.fillStyle = l.color;
          ctx.fillText(l.text, 110, 230 + idx * 24);
        });

        // Terminal Drawer (opens after 2.5s)
        if (sub > 2) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.roundRect(100, 520, 1080, 120, 10);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#38bdf8';
          ctx.font = '13px "JetBrains Mono", monospace';
          ctx.fillText('$ python emotion_detector.py --source webcam:0', 120, 550);
          ctx.fillStyle = '#94a3b8';
          ctx.fillText('[INFO] Initializing OpenCV video capture & face cascade detector...', 120, 574);
          ctx.fillText('[INFO] DeepFace neural network weights loaded successfully.', 120, 598);
          ctx.fillStyle = '#10b981';
          ctx.fillText('✓ [REAL-TIME PREDICTION] Dominant Emotion: Happy (98.4% Confidence) | Latency: 14ms', 120, 622);
        }

        ctx.restore();
      }

      // SCENE 3: SYSTEM ARCHITECTURE PIPELINE (11s - 17s)
      else if (time >= 11 && time < 17) {
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = '800 32px Inter, sans-serif';
        ctx.fillText('End-to-End AI & Data Pipeline Architecture', 80, 100);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 15px Inter, sans-serif';
        ctx.fillText('Structured flow from real-time webcam frames to deep neural inference and responsive dashboard metrics', 80, 128);

        const nodes = [
          { title: '1. Input Stream', sub: 'Webcam / Image Upload', icon: '📹', color: '#38bdf8' },
          { title: '2. Preprocessing', sub: 'OpenCV Face Crop', icon: '✂️', color: '#818cf8' },
          { title: '3. DeepFace AI', sub: 'Emotion Classification', icon: '🧠', color: '#c084fc' },
          { title: '4. Backend API', sub: 'Django / Flask REST', icon: '⚙️', color: '#34d399' },
          { title: '5. Dashboard UI', sub: 'Real-Time Emotion Vis', icon: '📊', color: '#f59e0b' }
        ];

        nodes.forEach((n, i) => {
          const x = 80 + i * 230;
          const y = 240;

          // Card
          ctx.fillStyle = '#111827';
          ctx.strokeStyle = n.color;
          ctx.lineWidth = 2;
          ctx.roundRect(x, y, 180, 200, 14);
          ctx.fill(); ctx.stroke();

          // Icon circle
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.beginPath(); ctx.arc(x + 90, y + 55, 30, 0, Math.PI * 2); ctx.fill();
          ctx.font = '24px Inter, sans-serif';
          ctx.fillText(n.icon, x + 76, y + 64);

          // Labels
          ctx.fillStyle = '#fff';
          ctx.font = '700 15px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(n.title, x + 90, y + 120);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '400 12px Inter, sans-serif';
          ctx.fillText(n.sub, x + 90, y + 148);
          ctx.textAlign = 'left';

          // Arrow to next
          if (i < 4) {
            ctx.fillStyle = '#38bdf8';
            ctx.font = '22px Inter, sans-serif';
            ctx.fillText('➔', x + 195, y + 105);
          }
        });

        // 4 Core Competency Boxes below
        const pillars = [
          { title: 'Computer Vision', desc: 'OpenCV, Face Segmentation & DeepFace' },
          { title: 'Data Science', desc: 'Pandas, NumPy, Scikit-learn, EDA' },
          { title: 'Full-Stack Web', desc: 'Django, Flask, HTML5, CSS3, JS' },
          { title: 'Database Systems', desc: 'MySQL, SQLite, Schema Normalization' }
        ];

        pillars.forEach((p, i) => {
          const px = 80 + i * 285;
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1;
          ctx.roundRect(px, 500, 260, 110, 12);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#38bdf8';
          ctx.font = '700 15px Inter, sans-serif';
          ctx.fillText('● ' + p.title, px + 20, 535);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '400 13px Inter, sans-serif';
          ctx.fillText(p.desc, px + 20, 565);
        });

        ctx.restore();
      }

      // SCENE 4: PROJECTS SHOWCASE (17s - 24s)
      else if (time >= 17 && time < 24) {
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = '800 32px Inter, sans-serif';
        ctx.fillText('Featured Projects & Real-World Implementations', 80, 100);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 15px Inter, sans-serif';
        ctx.fillText('Engineered with production-grade clean code, modular structure, and open-source documentation', 80, 128);

        const projects = [
          {
            title: 'Face Emotion Detector',
            tag: 'OpenCV • DeepFace • Django',
            bullets: [
              'Identifies 7 expressions from live webcam or photo uploads',
              'DeepFace deep learning multi-class emotion classifier',
              'Full-stack Django web interface with instant visual analytics'
            ],
            color: '#38bdf8'
          },
          {
            title: 'Random Password Generator',
            tag: 'Flask • Python • OWASP',
            bullets: [
              'Generates cryptographically secure random passwords',
              'OWASP compliant with customizable length & symbols',
              'Client-side instant copy & CSV export functionality'
            ],
            color: '#10b981'
          },
          {
            title: 'Data Science & EDA Pipeline',
            tag: 'Pandas • Scikit-learn • APSSDC',
            bullets: [
              'End-to-end data preprocessing & exploratory analysis',
              'Systematic outlier treatment and feature scaling',
              'Predictive modeling with 94.6% ROC-AUC evaluation'
            ],
            color: '#a855f7'
          }
        ];

        projects.forEach((proj, i) => {
          const px = 80 + i * 380;
          ctx.fillStyle = '#111827';
          ctx.strokeStyle = proj.color;
          ctx.lineWidth = 2;
          ctx.roundRect(px, 170, 350, 480, 16);
          ctx.fill(); ctx.stroke();

          // Header block
          ctx.fillStyle = 'rgba(255,255,255,0.04)';
          ctx.roundRect(px, 170, 350, 80, [16, 16, 0, 0]);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.font = '700 18px Inter, sans-serif';
          ctx.fillText(proj.title, px + 20, 205);

          ctx.fillStyle = proj.color;
          ctx.font = '600 12px "JetBrains Mono", monospace';
          ctx.fillText(proj.tag, px + 20, 230);

          // Bullets
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '400 13px Inter, sans-serif';
          proj.bullets.forEach((b, bIdx) => {
            ctx.fillStyle = '#10b981';
            ctx.fillText('✔', px + 20, 280 + bIdx * 50);
            ctx.fillStyle = '#cbd5e1';
            const words = b.split(' ');
            let line1 = '', line2 = '';
            words.forEach(w => {
              if ((line1 + ' ' + w).length < 32 && line2 === '') {
                line1 += ' ' + w;
              } else {
                line2 += ' ' + w;
              }
            });
            ctx.fillText(line1.trim(), px + 40, 280 + bIdx * 50);
            if (line2) ctx.fillText(line2.trim(), px + 40, 298 + bIdx * 50);
          });

          // GitHub badge
          ctx.fillStyle = '#1f2937';
          ctx.roundRect(px + 20, 580, 310, 40, 8);
          ctx.fill();
          ctx.fillStyle = '#38bdf8';
          ctx.font = '600 13px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('View on GitHub (@Bhavana-1228) →', px + 175, 605);
          ctx.textAlign = 'left';
        });

        ctx.restore();
      }

      // SCENE 5: ACADEMIC PATHWAY & TIMELINE (24s - 29s)
      else if (time >= 24 && time < 29) {
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = '800 32px Inter, sans-serif';
        ctx.fillText('Education, Internships & Certifications', 80, 100);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 15px Inter, sans-serif';
        ctx.fillText('Proven scholastic discipline and specialized technical training', 80, 128);

        const milestones = [
          { role: 'Artificial Intelligence Intern', org: 'Corizo', date: 'Oct 2023', score: 'Completed', color: '#10b981' },
          { role: 'Advanced Data Science Intern', org: 'APSSDC', date: 'Feb 2024', score: 'Certified', color: '#0284c7' },
          { role: 'B.Tech in AI & Data Science', org: 'Annamacharya Inst. of Tech & Sciences (AITS)', date: '2022 - 2026', score: '8.12 CGPA', color: '#3b82f6' },
          { role: 'Intermediate (MPC)', org: 'Sri Chaitanya Jr College, Kurnool', date: '2020 - 2022', score: '77%', color: '#f59e0b' },
          { role: 'Secondary School (SSC)', org: 'Good Shepherd EM High School', date: '2019 - 2020', score: '8.7 CGPA', color: '#ec4899' }
        ];

        milestones.forEach((m, idx) => {
          const my = 170 + idx * 95;
          ctx.fillStyle = '#111827';
          ctx.strokeStyle = m.color;
          ctx.lineWidth = 1.5;
          ctx.roundRect(80, my, 1120, 80, 12);
          ctx.fill(); ctx.stroke();

          // Bullet
          ctx.fillStyle = m.color;
          ctx.beginPath(); ctx.arc(115, my + 40, 10, 0, Math.PI * 2); ctx.fill();

          // Title & Org
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 16px Inter, sans-serif';
          ctx.fillText(m.role, 145, my + 34);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '400 13px Inter, sans-serif';
          ctx.fillText(m.org, 145, my + 56);

          // Date & Score Badge
          ctx.fillStyle = '#64748b';
          ctx.font = '500 14px "JetBrains Mono", monospace';
          ctx.fillText(m.date, 880, my + 45);

          ctx.fillStyle = m.color;
          ctx.font = '700 15px Inter, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(m.score, 1170, my + 45);
          ctx.textAlign = 'left';
        });

        ctx.restore();
      }

      // SCENE 6: CONNECT & RESUME (29s - 35s)
      else if (time >= 29 && time <= 35) {
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = '800 36px Inter, sans-serif';
        ctx.fillText("Let's Connect & Collaborate", 80, 105);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '500 16px Inter, sans-serif';
        ctx.fillText('Available for Full-Time AI & Data Science Roles, Internships & Engineering Opportunities', 80, 135);

        // 4 Large Contact Channel Cards
        const channels = [
          { title: 'Direct Email', value: 'bhavanareddy2328@gmail.com', icon: '✉️', color: '#ea4335' },
          { title: 'WhatsApp', value: '+91 95158 87989', icon: '💬', color: '#25d366' },
          { title: 'GitHub', value: 'github.com/Bhavana-1228', icon: '🐙', color: '#f3f4f6' },
          { title: 'LinkedIn', value: 'bhavana-reddy-chinnaobaiahgari', icon: '🔗', color: '#0a66c2' }
        ];

        channels.forEach((c, idx) => {
          const cx = 80 + (idx % 2) * 570;
          const cy = 180 + Math.floor(idx / 2) * 140;

          ctx.fillStyle = '#111827';
          ctx.strokeStyle = c.color;
          ctx.lineWidth = 1.5;
          ctx.roundRect(cx, cy, 540, 115, 14);
          ctx.fill(); ctx.stroke();

          ctx.font = '32px Inter, sans-serif';
          ctx.fillText(c.icon, cx + 25, cy + 65);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '600 13px Inter, sans-serif';
          ctx.fillText(c.title.toUpperCase(), cx + 80, cy + 45);

          ctx.fillStyle = '#ffffff';
          ctx.font = '700 17px "JetBrains Mono", monospace';
          ctx.fillText(c.value, cx + 80, cy + 76);
        });

        // Resume Download Banner
        ctx.fillStyle = 'linear-gradient(90deg, #1e3a8a, #065f46)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.roundRect(80, 480, 1120, 130, 16);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '800 22px Inter, sans-serif';
        ctx.fillText('📄 Curriculum Vitae (Bhavana Reddy Resume)', 115, 530);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '400 14px Inter, sans-serif';
        ctx.fillText('Hosted securely on Google Drive with direct high-speed local PDF download option.', 115, 560);
        ctx.fillText('Visit Live Portfolio: https://bhavana-1228.github.io/Portfolio/', 115, 585);

        ctx.fillStyle = '#2563eb';
        ctx.roundRect(930, 520, 230, 50, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '700 15px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Open Live Website ➔', 1045, 552);
        ctx.textAlign = 'left';

        ctx.restore();
      }
    }

    function update() {
      const now = performance.now();
      const dt = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = 0; // loop
        }
      }

      // Update UI
      const pct = (currentTime / TOTAL_DURATION) * 100;
      timelineProgress.style.width = pct + '%';

      const curSec = Math.floor(currentTime);
      const totalSec = Math.floor(TOTAL_DURATION);
      timeDisplay.textContent = 
        `00:${curSec < 10 ? '0' + curSec : curSec} / 00:${totalSec < 10 ? '0' + totalSec : totalSec}`;

      // Highlight active scene pill
      scenePills.forEach(p => {
        const t = parseFloat(p.dataset.time);
        if (currentTime >= t && currentTime < t + 6) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });

      renderScene(currentTime);
      requestAnimationFrame(update);
    }

    // Play / Pause
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.className = 'fa-solid fa-pause';
        playText.textContent = 'Pause';
      } else {
        playIcon.className = 'fa-solid fa-play';
        playText.textContent = 'Play';
      }
    });

    // Restart
    restartBtn.addEventListener('click', () => {
      currentTime = 0;
      isPlaying = true;
      playIcon.className = 'fa-solid fa-pause';
      playText.textContent = 'Pause';
    });

    // Timeline Scrubbing
    timelineBar.addEventListener('click', (e) => {
      const rect = timelineBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = ratio * TOTAL_DURATION;
    });

    // Scene pills jump
    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        currentTime = parseFloat(pill.dataset.time);
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        playText.textContent = 'Pause';
      });
    });

    // VIDEO EXPORT via MediaRecorder
    recordBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      currentTime = 0;
      isPlaying = true;
      recordedChunks = [];

      const stream = canvas.captureStream(30);
      const options = { mimeType: 'video/webm;codecs=vp9' };

      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Bhavana_Reddy_Portfolio_Demo.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        recordText.textContent = 'Export Video File';
        recordBtn.style.background = '#dc2626';
        isRecording = false;
        alert('🎉 Demo video recorded and downloaded successfully as Bhavana_Reddy_Portfolio_Demo.webm!');
      };

      mediaRecorder.start();
      isRecording = true;
      recordText.textContent = 'Recording (35s)...';
      recordBtn.style.background = '#f59e0b';

      setTimeout(() => {
        if (isRecording) {
          stopRecording();
        }
      }, (TOTAL_DURATION + 0.5) * 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // Start Animation Loop
    requestAnimationFrame(update);
  </script>
